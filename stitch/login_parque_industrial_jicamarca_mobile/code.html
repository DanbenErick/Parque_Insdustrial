<body class="flex flex-col min-h-screen text-on-background">
<!-- Transactional Header (TopNavBar variant for login) -->
<header class="flex justify-center items-center w-full px-lg h-24 bg-surface">
<div class="flex flex-col items-center"><h1 class="font-headline-md text-headline-md font-bold text-primary">Parque Industrial Jicamarca</h1></div>
</header>
<main class="flex-grow flex items-center justify-center px-margin-mobile py-xl">
<div class="w-full max-w-sm flex flex-col gap-xl">
<!-- Hero Illustration or Brand Image -->
<div class="relative w-full h-40 rounded-xl overflow-hidden border border-outline-variant shadow-sm">
<img alt="Jicamarca Industrial Park" class="w-full h-full object-cover" data-alt="A high-tech industrial facility at dawn with cooling towers and power lines under a soft teal sky. The image has a clean, professional corporate aesthetic with high clarity and balanced lighting, matching a sophisticated light-mode UI. Modern engineering structures are shown with technical precision and a serene, reliable atmosphere." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC3i8Bn25qyA1Igyq-AvdSI8JjY_1kfiW_CgpWluWVCSvI_uqnXnovT9DRqZeU7hHkyXQ9-xAOxE7x3l12iZ7E6sdsZTerCvngw8_xfRB1WgfqeghdcdpL9pP-6NbjoEPXUWMqKiPfVdY0_vAtxFKdp1iiVI5FhBkjFsCd9BA8ignUlSetjcF2dZ-3jNwzt9ubBqqcHJ2Y1ez6JLoC4qmMQnsrq8tj6TDwmNhqR2YNfqLOA0Vz2StqW8BPbjPAhTcaaDB35aRdzJgg">

</div>
</div>
<section class="bg-surface-container-lowest p-lg rounded-xl border border-outline-variant">
<form class="flex flex-col gap-lg" id="loginForm" onsubmit="return false;">
<!-- Role Selector -->
<div class="flex flex-col gap-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant">SELECCIONAR ROL</label>
<div class="grid grid-cols-3 gap-xs">
<button class="role-btn active-role flex flex-col items-center justify-center p-sm border border-outline-variant rounded-lg transition-all active:opacity-80" onclick="selectRole(this)" type="button">
<span class="material-symbols-outlined mb-xs">engineering</span>
<span class="font-body-sm text-xs">Admin</span>
</button>
<button class="role-btn flex flex-col items-center justify-center p-sm border border-outline-variant rounded-lg hover:bg-surface-container transition-all active:opacity-80" onclick="selectRole(this)" type="button">
<span class="material-symbols-outlined mb-xs">verified_user</span>
<span class="font-body-sm text-xs">Moderador</span>
</button>
<button class="role-btn flex flex-col items-center justify-center p-sm border border-outline-variant rounded-lg hover:bg-surface-container transition-all active:opacity-80" onclick="selectRole(this)" type="button">
<span class="material-symbols-outlined mb-xs">person</span>
<span class="font-body-sm text-xs">Miembro</span>
</button>
</div>
</div>
<!-- Input Fields -->
<div class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="username">USUARIO</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">account_circle</span>
<input class="w-full pl-12 pr-md py-md bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary font-body-md transition-all outline-none" id="username" placeholder="Ingresa tu usuario" type="text">
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="password">CONTRASEÑA</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-12 pr-12 py-md bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary font-body-md transition-all outline-none" id="password" placeholder="••••••••" type="password">
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="passwordIcon">visibility</span>
</button>
</div>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end">
<a class="font-body-sm text-primary hover:underline" href="#">¿Olvidaste tu contraseña?</a>
</div>
<!-- Action Button -->
<button class="w-full py-md bg-primary text-white font-headline-sm rounded-lg hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-sm" onclick="handleLogin()" type="button">

<div class="flex gap-md">
<span class="font-data-mono text-data-mono text-on-surface-variant opacity-60">Parque Industrial Jicamarca v1.2.4</span>
</div>
</footer>
<script>
        function selectRole(element) {
            document.querySelectorAll('.role-btn').forEach(btn => {
                btn.classList.remove('active-role', 'bg-secondary-container', 'text-on-secondary-container');
                btn.classList.add('hover:bg-surface-container');
            });
            element.classList.add('active-role');
            element.classList.remove('hover:bg-surface-container');
        }

        function togglePassword() {
            const passInput = document.getElementById('password');
            const passIcon = document.getElementById('passwordIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                passIcon.innerText = 'visibility_off';
            } else {
                passInput.type = 'password';
                passIcon.innerText = 'visibility';
            }
        }

        function handleLogin() {
            const btn = event.currentTarget;
            const originalContent = btn.innerHTML;
            
            // Basic UI Feedback
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span><span>Procesando...</span>';
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span><span>Acceso Concedido</span>';
                btn.classList.replace('bg-primary', 'bg-tertiary-container');
                
                setTimeout(() => {
                    // Simulation of redirect
                    alert('Bienvenido al panel de control de EnergiCore Peru - Sede Jicamarca');
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-tertiary-container', 'bg-primary');
                }, 1000);
            }, 1500);
        }
    </script>
